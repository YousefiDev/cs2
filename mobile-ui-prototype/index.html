<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mobile UI Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- Header -->
    <header class="topbar">
      <button class="btn icon-btn" id="menuBtn" aria-label="باز کردن منو">
        <!-- hamburger -->
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="title">نمونهٔ موبایل</div>
      <button class="btn icon-btn" id="searchBtn" aria-label="جستجو">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 21l-4.35-4.35M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        </svg>
      </button>
    </header>

    <!-- Side Drawer -->
    <nav class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-inner">
        <div class="drawer-header">
          <div class="avatar">Y</div>
          <div>
            <div class="name">کاربر</div>
            <div class="sub">ورود / ثبت‌نام</div>
          </div>
        </div>
        <ul class="drawer-list">
          <li><button class="drawer-link">خانه</button></li>
          <li><button class="drawer-link">پروفایل</button></li>
          <li><button class="drawer-link">پیام‌ها</button></li>
          <li><button class="drawer-link">تنظیمات</button></li>
        </ul>
      </div>
      <button class="drawer-backdrop" id="drawerClose" aria-label="بستن منو"></button>
    </nav>

    <!-- Main content -->
    <main class="content" id="content" role="main">
      <section class="hero">
        <h1>سلام 👋</h1>
        <p>نسخهٔ موبایل را ساده، سریع و دسترس‌پذیر طراحی کردم.</p>
      </section>

      <section class="cards" aria-label="فهرست آیتم‌ها">
        <!-- Example cards -->
        <article class="card">
          <div class="card-body">
            <h3>عنوان آیتم اول</h3>
            <p class="muted">توضیح کوتاه دربارهٔ آیتم اول. خلاصه و خوانا.</p>
          </div>
          <div class="card-meta">
            <button class="btn">باز</button>
          </div>
        </article>

        <article class="card">
          <div class="card-body">
            <h3>عنوان آیتم دوم</h3>
            <p class="muted">توضیح کوتاه دربارهٔ آیتم دوم.</p>
          </div>
          <div class="card-meta">
            <button class="btn">با��</button>
          </div>
        </article>

      </section>
    </main>

    <!-- Floating action button -->
    <button class="fab" id="fab" aria-label="عمل اصلی">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" role="navigation" aria-label="ناوبری اصلی">
      <button class="nav-item active" data-route="home">
        <span class="icon">🏠</span>
        <span class="label">خانه</span>
      </button>
      <button class="nav-item" data-route="search">
        <span class="icon">🔍</span>
        <span class="label">جستجو</span>
      </button>
      <button class="nav-item" data-route="notifications">
        <span class="icon">🔔</span>
        <span class="label">نوتیف</span>
      </button>
      <button class="nav-item" data-route="profile">
        <span class="icon">👤</span>
        <span class="label">پروفایل</span>
      </button>
    </nav>

    <!-- Simple modal for search -->
    <div class="modal" id="searchModal" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-inner">
        <div class="modal-header">
          <input id="searchInput" type="search" placeholder="جستجو کن..." aria-label="جستجو" />
          <button class="btn icon-btn" id="closeSearch" aria-label="بستن جستجو">✕</button>
        </div>
        <div class="modal-body">
          <p class="muted">نتایج سریع ظاهر می‌شوند...</p>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
