<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ادیتور مپ — CS2</title>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js" } }</script>
<style>
:root{--bg:#14171c;--panel:#1c2027;--panel2:#242933;--line:#333a47;--tx:#e8ebf0;--mut:#8b94a5;--acc:#f0a53a;--acc2:#4aa3ff;--bad:#ff5d5d;--ok:#4cd07d}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 Tahoma,"Segoe UI",system-ui,sans-serif;overflow:hidden}
button,select,input{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.on{background:var(--acc);color:#111;border-color:var(--acc)}button.pri{background:var(--acc2);color:#04121f;border-color:var(--acc2);font-weight:700}
input[type=number]{width:70px}input[type=text]{width:120px}input[type=color]{padding:0;width:34px;height:28px}
#app{display:grid;grid-template-rows:auto auto 1fr auto;height:100%}
#top,#opts{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
#opts{background:var(--panel2);min-height:40px}#opts label{display:inline-flex;gap:4px;align-items:center;color:var(--mut)}
#main{display:grid;grid-template-columns:54px 1fr 300px;min-height:0}
#tools{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:6px}
#tools button{padding:6px 2px;font-size:11px;line-height:1.2;text-align:center}#tools button b{display:block;font-size:17px}
#stage{position:relative;min-width:0;display:grid;grid-template-columns:1fr}#stage.split{grid-template-columns:1fr 1fr}
#v2d,#v3d{position:relative;min-width:0;min-height:0;overflow:hidden}#stage.s3d #v2d{display:none}#stage.s2d #v3d{display:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:8px}
#side h4{margin:10px 0 6px;color:var(--acc);font-size:13px}#side .row{display:flex;gap:6px;align-items:center;margin:4px 0;flex-wrap:wrap}#side .row>span{min-width:78px;color:var(--mut)}
.tabs{display:flex;gap:4px;margin-bottom:6px}.tabs button{flex:1}
#status{display:flex;gap:14px;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--mut);font-size:12px;overflow-x:auto;white-space:nowrap}
.issue{padding:6px 8px;border-radius:6px;margin:4px 0;background:var(--panel2);border-right:3px solid var(--mut);cursor:pointer}.issue.error{border-color:var(--bad)}.issue.warn{border-color:var(--acc)}.issue.info{border-color:var(--acc2)}
#hud3d{position:absolute;top:8px;left:8px;background:#000a;padding:6px 9px;border-radius:6px;font-size:12px;pointer-events:none;direction:ltr;white-space:pre}
#login{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9}#login>div{background:var(--panel);padding:20px;border-radius:12px;min-width:300px;border:1px solid var(--line)}
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:8px;z-index:10;display:none}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-left:4px}
@media(max-width:820px){#main{grid-template-columns:48px 1fr}#side{position:fixed;bottom:30px;right:0;left:0;max-height:44vh;border-top:1px solid var(--line);z-index:5}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <select id="mapSel" style="max-width:170px"></select>
    <button id="bNew">＋ مپ جدید</button><button id="bDup">⧉ کپی</button><button id="bDel">🗑</button>
    <span style="width:1px;height:22px;background:var(--line)"></span>
    <button id="bUndo" title="Ctrl+Z">↶</button><button id="bRedo" title="Ctrl+Y">↷</button>
    <button id="bCheck">✔ بررسی مپ</button><button id="bDeco" title="چراغ و دکور متناسب با تم را خودکار می‌چیند (Ctrl+Z برمی‌گرداند)">✨ جزئیات خودکار</button><button id="bAuto" title="مسیر و نقاط نگهبانی ربات‌ها را از اسپاون و سایت‌ها می‌سازد">🤖 ساخت خودکار مسیر ربات</button>
    <span style="width:1px;height:22px;background:var(--line)"></span>
    <button id="vw2d" class="on">۲بعدی</button><button id="vwsp">دوتایی</button><button id="vw3d">۳بعدی</button>
    <span style="flex:1"></span>
    <button id="bExp">⬇ JSON</button><button id="bImp">⬆ JSON</button><input id="file" type="file" accept=".json,application/json" hidden>
    <button id="bSave" class="pri">💾 ذخیره روی سرور</button>
  </div>
  <div id="opts"></div>
  <div id="main">
    <div id="tools"></div>
    <div id="stage" class="s2d">
      <div id="v2d"><canvas id="c2d"></canvas></div>
      <div id="v3d"><canvas id="c3d"></canvas><div id="hud3d"></div></div>
    </div>
    <div id="side">
      <div class="tabs"><button data-tab="sel" class="on">انتخاب</button><button data-tab="map">مپ</button><button data-tab="chk">مشکلات</button><button data-tab="lay">لایه‌ها</button></div>
      <div id="tab"></div>
    </div>
  </div>
  <div id="status"><span id="stPos">—</span><span id="stCell"></span><span id="stMsg"></span><span style="flex:1"></span><span id="stSave"></span></div>
</div>
<div id="login"><div><h3 style="margin:0 0 10px">ورود به ادیتور</h3><div style="color:var(--mut);margin-bottom:8px">کلید Admin را وارد کن (روی سرور محلی در فایل <code>.admin-key</code> است). بدون کلید می‌توانی فقط ببینی و JSON بگیری.</div><input id="key" type="password" style="width:100%" placeholder="Admin key"><div id="authmsg" style="color:var(--bad);min-height:18px;margin:6px 0"></div><div style="display:flex;gap:6px"><button id="bLogin" class="pri" style="flex:1">ورود</button><button id="bGuest" style="flex:1">فقط مشاهده</button></div></div></div>
<div id="toast"></div>
<script type="module" src="/js/editor.js"></script>
</body>
</html>
